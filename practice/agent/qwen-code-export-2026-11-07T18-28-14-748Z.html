 fetch_tasks(api_url: str, timeout: float = 10) -\u003e list[dict[str, Any]]:\n    url = f\"{api_url.rstrip('/')}/api/tasks\"\n    request = urllib.request.Request(url, headers={\"Accept\": \"application/json\"})\n    try:\n        with urllib.request.urlopen(request, timeout=timeout) as response:\n            tasks = json.load(response)\n    except urllib.error.HTTPError as error:\n        raise RuntimeError(f\"TODO API вернул HTTP {error.code} для {url}\") from error\n    except (urllib.error.URLError, TimeoutError) as error:\n        reason = getattr(error, \"reason\", error)\n        raise RuntimeError(f\"Не удалось получить задачи из {url}: {reason}\") from error\n    except json.JSONDecodeError as error:\n        raise RuntimeError(f\"TODO API вернул некорректный JSON: {error}\") from error\n    if not isinstance(tasks, list) or any(not isinstance(task, dict) for task in tasks):\n        raise RuntimeError(\"Ответ TODO API должен быть JSON-списком объектов задач\")\n    return tasks\n\n\ndef deadline_status(task: dict[str, Any], as_of: date) -\u003e str:\n    if task[\"done\"]:\n        return \"Выполнена\"\n    if not task[\"due\"]:\n        return \"Без срока\"\n    due = date.fromisoformat(task[\"due\"])\n    if due \u003c as_of:\n        return \"Просрочена\"\n    if due == as_of:\n        return \"Срок сегодня\"\n    return \"В сроке\"\n\n\ndef summarize(tasks: list[dict[str, Any]], as_of: date) -\u003e dict[str, Any]:\n    completed = sum(bool(task[\"done\"]) for task in tasks)\n    open_tasks = len(tasks) - completed\n    statuses = Counter(deadline_status(task, as_of) for task in tasks)\n    priorities = {\n        priority: {\n            \"total\": sum(task[\"priority\"] == priority for task in tasks),\n            \"completed\": sum(task[\"priority\"] == priority and task[\"done\"] for task in tasks),\n            \"open\": sum(task[\"priority\"] == priority and not task[\"done\"] for task in tasks),\n        }\n        for priority in PRIORITIES\n    }\n    return {\n        \"total\": len(tasks),\n        \"completed\": completed,\n        \"open\": open_tasks,\n        \"completion_rate\": completed / len(tasks) if tasks else 0,\n        \"overdue_open\": statuses[\"Просрочена\"],\n        \"due_today_open\": statuses[\"Срок сегодня\"],\n        \"without_due_open\": sum(\n            not task[\"done\"] and not task[\"due\"] for task in tasks\n        ),\n        \"priorities\": priorities,\n    }\n\n\ndef _style_header(sheet, row: int = 1) -\u003e None:\n    fill = PatternFill(\"solid\", fgColor=\"1F4E78\")\n    for cell in sheet[row]:\n        cell.fill = fill\n        cell.font = Font(color=\"FFFFFF\", bold=True)\n        cell.alignment = Alignment(vertical=\"center\")\n\n\ndef _add_table(sheet, name: str) -\u003e None:\n    if sheet.max_row \u003c 2:\n        return\n    table = Table(displayName=name, ref=sheet.dimensions)\n    table.tableStyleInfo = TableStyleInfo(\n        name=\"TableStyleMedium2\",\n        showFirstColumn=False,\n        showLastColumn=False,\n        showRowStripes=True,\n        showColumnStripes=False,\n    )\n    sheet.add_table(table)\n\n\ndef create_report(\n    tasks: list[dict[str, Any]], output: str | Path, as_of: date | None = None\n) -\u003e Path:\n    as_of = as_of or date.today()\n    stats = summarize(tasks, as_of)\n    output_path = Path(output)\n    output_path.parent.mkdir(parents=True, exist_ok=True)\n\n    workbook = Workbook()\n    summary = workbook.active\n    summary.title = \"Сводка\"\n    summary.append([\"Показатель\", \"Значение\"])\n    summary_rows = [\n        (\"Дата отчёта\", as_of.isoformat()),\n        (\"Всего задач\", stats[\"total\"]),\n        (\"Выполнено\", stats[\"completed\"]),\n        (\"Не выполнено\", stats[\"open\"]),\n        (\"Доля выполненных\", stats[\"completion_rate\"]),\n        (\"Просрочено (открытые)\", stats[\"overdue_open\"]),\n        (\"Срок сегодня (открытые)\", stats[\"due_today_open\"]),\n        (\"Без срока (открытые)\", stats[\"without_due_open\"]),\n    ]\n    for row in summary_rows:\n        summary.append(row)\n    summary[\"B6\"].number_format = \"0.0%\"\n    summary.append([])\n    summary.append([\"Приоритет\", \"Всего\", \"Выполнено\", \"Не выполнено\"])\n    for priority in PRIORITIES:\n        values = stats[\"priorities\"][priority]\n        summary.append([\n            PRIORITY_LABELS[priority], values[\"total\"], values[\"completed\"], values[\"open\"]\n        ])\n    _style_header(summary, 1)\n    _style_header(summary, 11)\n    summary.freeze_panes = \"A2\"\n    summary.column_dimensions[\"A\"].width = 31\n    for column in \"BCD\":\n        summary.column_dimensions[column].width = 18\n\n    details = workbook.create_sheet(\"Задачи\")\n    headers = [\n        \"ID\", \"Название\", \"Статус\", \"Приоритет\", \"Срок\",\n        \"Статус срока\", \"Создана\",\n    ]\n    details.append(headers)\n    for task in sorted(tasks, key=lambda item: item[\"id\"]):\n        details.append([\n            task[\"id\"],\n            task[\"title\"],\n            \"Выполнена\" if task[\"done\"] else \"Не выполнена\",\n            PRIORITY_LABELS.get(task[\"priority\"], task[\"priority\"]),\n            task[\"due\"] or \"\",\n            deadline_status(task, as_of),\n            task.get(\"created_at\", \"\"),\n        ])\n    _style_header(details)\n    details.freeze_panes = \"A2\"\n    details.auto_filter.ref = details.dimensions\n    for column, width in {\"A\": 10, \"B\": 48, \"C\": 18, \"D\": 16, \"E\": 14, \"F\": 22, \"G\": 22}.items():\n        details.column_dimensions[column].width = width\n    _add_table(details, \"TodoTasks\")\n\n    methodology = workbook.create_sheet(\"Методика\")\n    methodology.append([\"Показатель\", \"Правило расчёта\"])\n    methodology_rows = [\n        (\"Всего задач\", \"Количество записей, полученных из TODO API.\"),\n        (\"Выполнено / Не выполнено\", \"Поле done равно true / false.\"),\n        (\"Доля выполненных\", \"Выпол MEOUT = 5\n\nmcp = FastMCP(\"todo\")\n\n\nclass TodoError(ToolError, ResourceError, ValueError):\n    \"\"\"Ожидаемая ошибка: её текст показывается агенту. Любое другое исключение SDK 2.x прячет\n    за «Error executing tool …», и модель не поймёт, что исправить.\"\"\"\n\n\ndef _log(msg: str) -\u003e None:\n    \"\"\"Лог в stderr (stdout занят протоколом) и, если задан TODO_MCP_LOG, в файл: клиент может прятать stderr.\"\"\"\n    line = f\"{datetime.now().strftime('%H:%M:%S.%f')[:-3]} [todo] {msg}\"\n    print(line, file=sys.stderr, flush=True)\n    path = os.environ.get(\"TODO_MCP_LOG\")\n    if path:\n        with open(path, \"a\", encoding=\"utf-8\") as f:\n            f.write(line + \"\\n\")\n\n\ndef _call(req: urllib.request.Request):\n    \"\"\"Выполняет запрос к API и переводит ошибки в понятные модели исключения.\"\"\"\n    try:\n        with urllib.request.urlopen(req, timeout=TIMEOUT) as resp:\n            return json.load(resp)\n    except urllib.error.HTTPError as e:\n        try:\n            message = json.load(e).get(\"error\")\n        except ValueError:\n            message = None\n        # 4xx — ошибка ввода: покажем модели текст API, чтобы она могла исправить вызов\n        raise TodoError(message or f\"API вернул ошибку {e.code}\") from None\n    except (urllib.error.URLError, TimeoutError) as e:\n        raise TodoError(\n            f\"TODO-приложение недоступно по адресу {API_URL} ({getattr(e, 'reason', e)}). \"\n            \"Запустите его: python -m todo.web\"\n        ) from None\n\n\ndef _get(path: str):\n    return _call(urllib.request.Request(API_URL + path, method=\"GET\"))\n\n\ndef _post(path: str, payload: dict) -\u003e dict:\n    return _call(urllib.request.Request(\n        API_URL + path,\n        data=json.dumps(payload).encode(\"utf-8\"),\n        headers={\"Content-Type\": \"application/json\"},\n        method=\"POST\",\n    ))\n\n\ndef _delete(path: str):\n    return _call(urllib.request.Request(API_URL + path, method=\"DELETE\"))\n\n\n@mcp.tool()\ndef add_task(title: str, priority: str = \"normal\", due: Optional[str] = None) -\u003e dict:\n    \"\"\"Добавляет задачу в TODO. Пробелы по краям названия удаляются,\n    пустое название запрещено, максимум 200 символов.\n\n    priority: low, normal или high. due: срок в формате YYYY-MM-DD (необязательно).\n    Возвращает созданную задачу с её id.\n    \"\"\"\n    return _post(\"/api/tasks\", {\"title\": title, \"priority\": priority, \"due\": due})\n\n\n@mcp.tool()\ndef list_tasks(done: Optional[bool] = None) -\u003e list:\n    \"\"\"Возвращает полный список задач.\n\n    done: true — только выполненные, false — только невыполненные, не задано — все.\n    \"\"\"\n    path = \"/api/tasks\"\n    if done is not None:\n        path += \"?\" + urlencode({\"done\": \"true\" if done else \"false\"})\n    return _get(path)\n\n\n@mcp.tool()\ndef complete_task(task_id: int) -\u003e dict:\n    \"\"\"Отмечает задачу выполненной. Повторный вызов для уже выполненной задачи не ошибка.\"\"\"\n    return _post(f\"/api/tasks/{task_id}/complete\", {})\n\n\nclass ConfirmDelete(BaseModel):\n    \"\"\"Форма подтверждения для Elicitation: только простые поля.\"\"\"\n    confirm: bool = Field(description=\"Да, удалить задачу\")\n\n\n@mcp.tool()\nasync def delete_task(task_id: int, ctx: Context) -\u003e dict:\n    \"\"\"Удаляет задачу. Перед удалением спрашивает подтверждение у пользователя (Elicitation);\n    при отказе задача остаётся на месте.\"\"\"\n    task = _get(f\"/api/tasks/{task_id}\")  # заодно проверяем, что задача существует\n    try:\n        result = await asyncio.wait_for(\n            ctx.elicit(f\"Удалить задачу «{task['title']}» (id {task_id})?\", ConfirmDelete),\n            timeout=float(os.environ.get(\"TODO_ELICIT_TIMEOUT\", \"60\")))\n    except asyncio.TimeoutError:\n        _log(f\"delete_task({task_id}): таймаут, ответа нет\")\n        return {\"status\": \"cancelled\",\n                \"message\": \"Пользователь не ответил на запрос под
